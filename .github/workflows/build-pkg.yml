name: Build PS3 GHL v0.6 comprehensive diagnostic PKG
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ps3-pkg:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Test telemetry analyzer (synthetic, non-hardware)
        shell: bash
        run: python3 -m unittest discover -s tests -v
      - name: Fetch pinned PS3DEV Linux SDK
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output /tmp/ps3dev.tar.gz "https://github.com/ps3dev/ps3dev/releases/download/nightly-2026-10-12/ps3dev-linux-X64.tar.gz"
          mkdir -p "$GITHUB_WORKSPACE/sdk"
          tar -xzf /tmp/ps3dev.tar.gz -C "$GITHUB_WORKSPACE/sdk"
          echo "PS3DEV=$GITHUB_WORKSPACE/sdk/ps3dev" >> "$GITHUB_ENV"
          echo "PSL1GHT=$GITHUB_WORKSPACE/sdk/ps3dev" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/sdk/ps3dev/bin" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/sdk/ps3dev/ppu/bin" >> "$GITHUB_PATH"
      - name: Compile and package from source
        shell: bash
        run: |
          set -euo pipefail
          make -f Makefile.ps3dev clean
          make -f Makefile.ps3dev all
          test -s ghl_ps4_probe.pkg
          file ghl_ps4_probe.pkg
          pkg --list ghl_ps4_probe.pkg | tee package-structure.txt
          grep -q 'USRDIR/EBOOT.BIN' package-structure.txt
          grep -q 'PARAM.SFO' package-structure.txt
          printf 'GHL PS4 receiver v0.6-onepass\nGit commit: %s\nUSB dongle target 1430:07BB\nNot hardware-tested\n' "$GITHUB_SHA" > BUILD_INFO.txt
          sha256sum ghl_ps4_probe.pkg > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: GHL-PS3-OnePass-v0.6-PKG
          path: |
            ghl_ps4_probe.pkg
            SHA256SUMS.txt
            BUILD_INFO.txt
            package-structure.txt
          if-no-files-found: error
